[package]
name = "config-disassembler"
version = "0.11.11"
edition = "2021"
description = "Disassemble config files into smaller files and reassemble on demand."
repository = "https://github.com/mcarvin8/config-disassembler"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "config_disassembler"
path = "src/lib.rs"

[[bin]]
name = "config-disassembler"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Fragment reassembly mirrors serde_json's preserve_order map (an IndexMap).
indexmap = "2"
json5 = "1"
toml = "1"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync"] }
sha2 = "0.11"
quick-xml = { version = "0.42", features = ["serialize"] }
ignore = "0.4"
log = "0.4"
regex = "1"
toon-format = { version = "0.7.0", default-features = false }
jsonc-parser = { version = "0.34.0", features = ["serde", "cst"] }
configparser = { version = "3.1.0", features = ["indexmap"] }
tempfile = "3"
serde-saphyr = "2"

[features]
# Heap-profile the replay example (examples/replay_workload.rs) with dhat:
# `cargo run --release --example replay_workload --features dhat-heap -- ...`.
# Used by the `heap` job in .github/workflows/profile.yml. No effect on the library.
dhat-heap = []

[dev-dependencies]
# Test-only logging (tests call env_logger::try_init); the library and CLI use the `log` facade.
env_logger = "0.11"
walkdir = "2"
# Heap profiler for the replay example's `dhat-heap` feature (see [features]).
dhat = "0.3"
# Renamed so bench code imports plain `criterion`. Outside CodSpeed's runner
# the compat crate behaves exactly like upstream criterion, so `cargo bench`
# works locally as usual; under `cargo codspeed run` it reports to CodSpeed.
criterion = { package = "codspeed-criterion-compat", version = "6", features = ["async_tokio"] }
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }

# Benchmarks (see benches/README.md). harness = false hands main() to criterion.
[[bench]]
name = "xml_micro"
harness = false

[[bench]]
name = "xml_macro"
harness = false
